<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuizCraft | Reset</title>
    <link rel="stylesheet" href="../css/reset.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23fbbf24'/><text x='50' y='72' font-size='65' font-family='Poppins,sans-serif' font-weight='700' text-anchor='middle' fill='%230f172a'>Q</text></svg>"
    />
  </head>
  <body>
    <div class="container">
      <div class="form-container">
        <form id="resetForm">
          <div class="logo-white-bg">QuizCraft</div>
          <h2>Set new Password</h2>
          <p class="subtitle">
            Create a strong password to secure your account
          </p>
          <div class="input-group">
            <input
              type="password"
              id="newPassword"
              placeholder="New Password"
              required
            />
            <i class="fa-solid fa-eye-slash togglePassword"></i>
          </div>
          <div class="input-group">
            <input
              type="password"
              id="confirmPassword"
              placeholder="Confirm Password"
              required
            />
            <i class="fa-solid fa-eye-slash togglePassword"></i>
          </div>
          <button type="submit" class="main-btn">Update Password</button>
        </form>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../js/reset.js"></script>
  </body>
</html>
